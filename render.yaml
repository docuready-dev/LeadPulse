services:
  # Unified Full-Stack Web Service (Serves Express API + Compiled React Frontend)
  - type: web
    name: strovr-platform
    runtime: node
    plan: starter
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
