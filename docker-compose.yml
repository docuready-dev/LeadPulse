services:
  # ---------------------------------------------------------------------------
  # LeadPulse Node.js / Express Backend
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: leadpulse-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      GOOGLE_CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-}"
    networks:
      - leadpulse-network

  # ---------------------------------------------------------------------------
  # LeadPulse React / Vite Frontend
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: leadpulse-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3001"
    depends_on:
      - server
    networks:
      - leadpulse-network

networks:
  leadpulse-network:
    driver: bridge
